name: Funny Weather CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-southeast-2
  TERRAFORM_VERSION: 1.5.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r src/lambdas/weather_fetcher/requirements.txt
          pip install -r src/lambdas/joke_generator/requirements.txt

      - name: Run tests
        run: |
          pytest tests/ --cov=src

  integration-test:
    needs: test
    runs-on: ubuntu-latest
    
    services:
      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: dynamodb,lambda,events
          DEFAULT_REGION: ap-southeast-2
        ports:
          - 4566:4566

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up AWS CLI
        run: |
          pip install awscli-local

      - name: Create DynamoDB table
        run: |
          aws --endpoint-url=http://localhost:4566 \
              --region ap-southeast-2 \
              dynamodb create-table \
              --table-name funny-weather-entries \
              --attribute-definitions \
                AttributeName=timestamp,AttributeType=S \
                AttributeName=location,AttributeType=S \
              --key-schema \
                AttributeName=timestamp,KeyType=HASH \
                AttributeName=location,KeyType=RANGE \
              --billing-mode PAY_PER_REQUEST

      - name: Test Weather Data Storage
        run: |
          # Insert test weather data
          aws --endpoint-url=http://localhost:4566 --region ap-southeast-2 \
            dynamodb put-item --table-name funny-weather-entries \
            --item '{
              "timestamp": {"S": "2025-02-11T10:00:00Z"},
              "location": {"S": "Wellington"},
              "weather_data": {"M": {
                "coordinates": {"M": {
                  "latitude": {"N": "-41.276825"},
                  "longitude": {"N": "174.777969"}
                }},
                "temperature": {"N": "15.5"},
                "wind_speed": {"N": "25.0"},
                "cloud_cover": {"N": "75"},
                "visibility": {"N": "10000"},
                "humidity": {"N": "85"}
              }},
              "status": {"S": "PENDING"}
            }'

          # Verify weather data
          aws --endpoint-url=http://localhost:4566 --region ap-southeast-2 \
            dynamodb get-item --table-name funny-weather-entries \
            --key '{"timestamp": {"S": "2025-02-11T10:00:00Z"}, "location": {"S": "Wellington"}}'

      - name: Test Joke Data Update
        run: |
          # Update with joke data
          aws --endpoint-url=http://localhost:4566 --region ap-southeast-2 \
            dynamodb update-item --table-name funny-weather-entries \
            --key '{"timestamp": {"S": "2025-02-11T10:00:00Z"}, "location": {"S": "Wellington"}}' \
            --update-expression "SET joke_data = :j, #s = :c" \
            --expression-attribute-names '{"#s": "status"}' \
            --expression-attribute-values '{
              ":j": {"M": {
                "emoji": {"S": "🌧️"},
                "weather_status": {"S": "Windy with light rain"},
                "jokes": {"L": [{"S": "Why did the weather report go to therapy? It was dealing with too many cloudy issues!"}]}
              }},
              ":c": {"S": "COMPLETE"}
            }'

      - name: Test Weather Storage
        run: |
          # Create test directory and copy files
          mkdir -p test_weather_storage
          cp -r src/lambdas/weather_storage/* test_weather_storage/
          cd test_weather_storage
          
          # Install dependencies
          pip install boto3 aws-lambda-powertools aws-xray-sdk pytest
          
          # Run test script
          python scripts/test_storage_lambda.py
        env:
          AWS_DEFAULT_REGION: ap-southeast-2
          DYNAMODB_TABLE: funny_weather_entries

      - name: Test Joke Storage
        run: |
          # Create test directory and copy files
          mkdir -p test_joke_storage
          cp -r src/lambdas/joke_storage/* test_joke_storage/
          cd test_joke_storage
          
          # Install dependencies
          pip install boto3 aws-lambda-powertools aws-xray-sdk pytest pytest-cov
          
          # Run tests with coverage
          pytest tests/ --cov=app --cov-report=term-missing
        env:
          AWS_DEFAULT_REGION: ap-southeast-2
          DYNAMODB_TABLE: funny-weather-entries

  terraform:
    needs: integration-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infrastructure
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infrastructure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

  deploy-lambda:
    needs: terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Deploy Lambda Functions
        run: |
          cd infrastructure
          bash scripts/build_lambda.sh
          bash scripts/build_joke_lambda.sh
          terraform apply -auto-approve 