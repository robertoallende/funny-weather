name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'src/frontend/funny-weather-ui/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/funny-weather-ui/package.json
          
      - name: Install Dependencies
        run: |
          cd src/frontend/funny-weather-ui
          npm ci
          
      - name: Build
        run: |
          cd src/frontend/funny-weather-ui
          npm run build
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
          
      - name: Deploy to S3
        run: |
          aws s3 sync src/frontend/funny-weather-ui/out/ s3://funny-weather-ui-${{ github.event.inputs.environment || 'dev' }} --delete
          
      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[].DomainName, 'funny-weather-ui-${{ github.event.inputs.environment || 'dev' }}')].Id" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*" 